<style>
  :root {
    color-scheme: light;
    --ink: #29433f;
    --paper: #fff8e8;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 38%, #295854 0%, #153b39 58%, #0f2c2c 100%);
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #f4d7ab;
  }

  .stage > svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- gentle ambient animation ---------- */
  @keyframes cloud-float {
    from { transform: translateY(-3px); }
    to   { transform: translateY(5px); }
  }

  @keyframes dash-move {
    from { transform: translateX(0); }
    to   { transform: translateX(-180px); }
  }

  @keyframes grass-sway {
    from { transform: rotate(-2.2deg); }
    to   { transform: rotate(2.4deg); }
  }

  @keyframes puff {
    0%   { opacity: 0; transform: translate(0, 0) scale(.25); }
    18%  { opacity: .42; }
    100% { opacity: 0; transform: translate(-74px, -24px) scale(1.35); }
  }

  @keyframes speed-streak {
    from { stroke-dashoffset: 320; opacity: 0; }
    25%  { opacity: .7; }
    to   { stroke-dashoffset: -180; opacity: 0; }
  }

  .cloud-float { animation: cloud-float 6.5s ease-in-out infinite alternate; }
  .cloud-float.slow { animation-duration: 9s; animation-delay: -3s; }
  .cloud-float.fast { animation-duration: 4.8s; animation-delay: -1.4s; }

  .road-dashes { animation: dash-move 1.15s linear infinite; }

  .puff { animation: puff 1.8s ease-out infinite; transform-box: fill-box; }
  .puff:nth-child(2) { animation-delay: .55s; }
  .puff:nth-child(3) { animation-delay: 1.15s; }

  .streak {
    stroke-dasharray: 34 286;
    animation: speed-streak 2.1s linear infinite;
  }
  .streak.s2 { animation-delay: -.7s; animation-duration: 2.5s; }
  .streak.s3 { animation-delay: -1.4s; animation-duration: 1.8s; }

  .grass-blade {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: grass-sway 2.9s ease-in-out infinite alternate;
  }
  .grass-blade.g2 { animation-delay: -.8s; animation-duration: 3.6s; }
  .grass-blade.g3 { animation-delay: -1.7s; animation-duration: 2.4s; }

  @media (prefers-reduced-motion: reduce) {
    .cloud-float,
    .road-dashes,
    .puff,
    .streak,
    .grass-blade { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"
     preserveAspectRatio="xMidYMid slice"
     role="img" aria-labelledby="artTitle artDesc">
  <title id="artTitle">骑单车的鹈鹕</title>
  <desc id="artDesc">一只戴红围巾的鹈鹕沿着乡间公路骑一辆珊瑚红色的自行车，车轮和踏板不停转动，背景是柔和的青山、云朵和阳光。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

      <stop offset=".34" stop-color="#c9e6dd"/>
      <stop offset=".62" stop-color="#f3e6c8"/>
      <stop offset=".82" stop-color="#f8d3a3"/>
      <stop offset="1"   stop-color="#f3bd86"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#ffe9b5" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#ffdf9d" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#ffda96" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d4c1"/>
      <stop offset="1" stop-color="#8eb9a3"/>
    </linearGradient>

    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cb69a"/>
      <stop offset="1" stop-color="#6c9f83"/>
    </linearGradient>

    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa98b"/>
      <stop offset="1" stop-color="#5e9276"/>
    </linearGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63726c"/>
      <stop offset=".16" stop-color="#55665f"/>
      <stop offset="1" stop-color="#42544f"/>
    </linearGradient>

    <linearGradient id="bodyWhite" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".56" stop-color="#fbf4e4"/>
      <stop offset="1" stop-color="#eee2cb"/>
    </linearGradient>

    <linearGradient id="wingWhite" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#f5ead6"/>
      <stop offset="1" stop-color="#e4d4b7"/>
    </linearGradient>

    <linearGradient id="beakOrange" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#ffca62"/>
      <stop offset=".48" stop-color="#f8a83f"/>
      <stop offset="1" stop-color="#e87c2d"/>
    </linearGradient>

    <linearGradient id="pouchOrange" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffd894"/>
      <stop offset=".48" stop-color="#f6b26c"/>
      <stop offset="1" stop-color="#eb9460"/>
    </linearGradient>

    <linearGradient id="framePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f06e58"/>
      <stop offset=".52" stop-color="#df523f"/>
      <stop offset="1" stop-color="#be3e31"/>
    </linearGradient>

    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5dda0"/>
      <stop offset=".5" stop-color="#d9b66e"/>
      <stop offset="1" stop-color="#ad8844"/>
    </linearGradient>

    <linearGradient id="scarfRed" x1="0" y1="0" x2="1" y2=".5">
      <stop offset="0" stop-color="#e15d4f"/>
      <stop offset="1" stop-color="#bd3b35"/>
    </linearGradient>

    <radialGradient id="vignette" cx=".5" cy=".46" r=".76">
      <stop offset=".62" stop-color="#173e38" stop-opacity="0"/>
      <stop offset="1" stop-color="#173e38" stop-opacity=".20"/>
    </radialGradient>

    <filter id="softBlur" x="-30%" y="-60%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="tinyBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <g id="wheelSpokes" stroke="#d8bd8b" stroke-width="2.6" stroke-linecap="round" opacity=".9">
      <line x1="445" y1="520" x2="445" y2="438"/>
      <line x1="445" y1="520" x2="486" y2="449"/>
      <line x1="445" y1="520" x2="516" y2="479"/>
      <line x1="445" y1="520" x2="527" y2="520"/>
      <line x1="445" y1="520" x2="516" y2="561"/>
      <line x1="445" y1="520" x2="486" y2="591"/>
      <line x1="445" y1="520" x2="445" y2="602"/>
      <line x1="445" y1="520" x2="404" y2="591"/>
      <line x1="445" y1="520" x2="374" y2="561"/>
      <line x1="445" y1="520" x2="363" y2="520"/>
      <line x1="445" y1="520" x2="374" y2="479"/>
      <line x1="445" y1="520" x2="404" y2="449"/>
    </g>

    <g id="cloudShape">
      <path d="M -82 24 C -102 24 -114 11 -109 -4 C -104 -19 -87 -25 -73 -19
               C -68 -40 -43 -52 -23 -41 C -13 -63 14 -67 28 -48
               C 42 -56 64 -48 68 -30 C 86 -27 96 -12 88 3
               C 98 9 96 21 83 24 Z"

    </g>

    <g id="treeShape">
      <path d="M 0 88 C -3 46 0 22 5 0" fill="none" stroke="#705443" stroke-width="11" stroke-linecap="round"/>
      <path d="M 2 54 C -10 43 -20 35 -28 22 M 3 42 C 15 30 24 23 31 11"

      <circle cx="-22" cy="8" r="34" fill="#3f7b65"/>
      <circle cx="22" cy="2" r="40" fill="#4b8b71"/>
      <circle cx="2" cy="-28" r="38" fill="#579a7c"/>
      <circle cx="-40" cy="-18" r="24" fill="#36705b"/>

      <circle cx="-10" cy="-46" r="22" fill="#67a888"/>
      <circle cx="20" cy="-43" r="16" fill="#74b090" opacity=".85"/>

  </defs>

  <!-- ============ SKY ============ -->
  <rect width="1200" height="760" fill="url(#sky)"/>

  <!-- sun and glow -->

    <circle cx="958" cy="178" r="196" fill="url(#sunGlow)"/>
    <circle cx="958" cy="178" r="104" fill="#ffdda0" opacity=".28"/>

    <circle cx="958" cy="178" r="78" fill="none" stroke="#ffefc9" stroke-width="2" opacity=".6"/>

  <!-- clouds -->
  <g transform="translate(208 132)" opacity=".92">

  <g transform="translate(600 73)" opacity=".74">

  <g transform="translate(968 98)" opacity=".48">

  <!-- little birds -->

    <path d="M 384 190 C 390 184 395 184 401 190 C 407 184 412 184 418 190"/>
    <path d="M 454 226 C 459 221 463 221 468 226 C 473 221 477 221 482 226"/>

  <!-- ============ LANDSCAPE ============ -->
  <!-- distant hills -->
  <path d="M 0 476 C 104 431 193 462 282 439 C 380 414 449 463 547 438

  <path d="M 0 533 C 132 480 242 514 367 489 C 500 462 596 511 717 494

  <!-- distant tree line -->
  <g fill="#4f846d" opacity=".72">
    <circle cx="58" cy="510" r="18"/><circle cx="86" cy="499" r="23"/>
    <circle cx="116" cy="512" r="16"/>
    <circle cx="292" cy="518" r="14"/><circle cx="315" cy="507" r="20"/>
    <circle cx="338" cy="518" r="12"/>
    <circle cx="648" cy="505" r="15"/><circle cx="671" cy="494" r="21"/>
    <circle cx="696" cy="508" r="13"/>
    <circle cx="903" cy="511" r="16"/><circle cx="927" cy="499" r="22"/>
    <circle cx="953" cy="512" r="14"/>
    <circle cx="1144" cy="506" r="17"/><circle cx="1170" cy="494" r="24"/>

  <!-- meadow -->
  <path d="M 0 581 C 154 548 294 573 436 554 C 596 532 755 568 910 549

  <path d="M 0 593 C 190 574 400 592 600 574 C 814 555 1015 585 1200 568"

  <!-- roadside trees -->

  </g>
  <g transform="translate(1088 476) scale(.84)">

    <use href="#treeShape"/>
  </g>
  <g transform="translate(1004 520) scale(.5)" opacity=".92">
    <use href="#treeShape"/>
  </g>

  <!-- small bushes near road -->
  <g fill="#4f826b">
    <path d="M 226 583 C 236 562 261 559 273 576 C 286 558 316 565 319 585 Z"/>

  <g fill="#6a9b7d">

  <!-- ============ ROAD ============ -->

  <g class="road-dashes" stroke="#edd9ac" stroke-width="6" stroke-linecap="round" opacity=".56">

    <line x1="140" y1="694" x2="230" y2="694"/><line x1="320" y1="694" x2="410" y2="694"/>

    <line x1="860" y1="694" x2="950" y2="694"/><line x1="1040" y1="694" x2="1130" y2="694"/>
    <line x1="1220" y1="694" x2="1310" y2="694"/><line x1="1400" y1="694" x2="1490" y2="694"/>
  </g>

  <!-- road texture -->
  <g fill="#d7c7a5" opacity=".16">
    <circle cx="112" cy="657" r="3"/><circle cx="284" cy="725" r="2.5"/>
    <circle cx="486" cy="646" r="2"/><circle cx="694" cy="735" r="3"/>
    <circle cx="925" cy="659" r="2.5"/><circle cx="1112" cy="719" r="2"/>
    <circle cx="1010" cy="646" r="2"/><circle cx="366" cy="679" r="1.8"/>
  </g>

  <!-- shadow under bicycle -->
  <ellipse cx="623" cy="622" rx="258" ry="17" fill="#1e3833" opacity=".28" filter="url(#softBlur)"/>

  <g fill="none" stroke="#fff6dc" stroke-width="4" stroke-linecap="round" opacity=".65">

    <path class="streak s2" d="M 171 449 C 235 440 273 447 318 442"/>
    <path class="streak s3" d="M 238 338 C 280 330 309 333 333 329"/>

    <g class="puff"><circle cx="0" cy="0" r="14" fill="#ead9b5" opacity=".55"/></g>
    <g class="puff"><circle cx="0" cy="0" r="8" fill="#fff2d5" opacity=".72"/></g>

  <!-- ============ BICYCLE + PELICAN ============ -->

    <!-- ===== rear wheel ===== -->

    <!-- ===== bicycle frame ===== -->
    <g id="bicycle">
      <!-- chain -->
      <g class="chain" fill="none" stroke="#394945" stroke-width="3.6" stroke-linecap="round">
        <path d="M 445 507 L 618 497"/>
        <path d="M 445 533 L 618 559"/>
        <path d="M 445 507 L 618 497" stroke="#c8b98f" stroke-width="1.2"
              stroke-dasharray="3 5" opacity=".8">
          <animate attributeName="stroke-dashoffset" from="0" to="-16"
                   dur=".34s" repeatCount="indefinite"/>
        </path>
        <path d="M 445 533 L 618 559" stroke="#c8b98f" stroke-width="1.2"
              stroke-dasharray="3 5" opacity=".8">
          <animate attributeName="stroke-dashoffset" from="0" to="-16"
                   dur=".34s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle cx="445" cy="520" r="14" fill="url(#brass)" stroke="#2c3b38" stroke-width="3"/>
      <circle cx="445" cy="520" r="4" fill="#2c3b38"/>

      <!-- fenders -->
      <path d="M 355 487 A 96 96 0 0 1 535 487" fill="none" stroke="#c84938" stroke-width="10" stroke-linecap="round"/>
      <path d="M 355 487 A 96 96 0 0 1 535 487" fill="none" stroke="#f08a70" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M 709 487 A 96 96 0 0 1 889 487" fill="none" stroke="#c84938" stroke-width="10" stroke-linecap="round"/>
      <path d="M 709 487 A 96 96 0 0 1 889 487" fill="none" stroke="#f08a70" stroke-width="3" stroke-linecap="round" opacity=".8"/>
      <path d="M 354 486 C 346 500 345 514 348 526" fill="none" stroke="#c84938" stroke-width="8" stroke-linecap="round"/>

<script>
(() => {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  const crankX = 618;
  const crankY = 528;
  const crankR = 42;

  const legs = [
    {
      phase: Math.PI,
      hip: { x: 556, y: 378 },
      femur: 110,
      tibia: 112,
      thighOut: $("farThighOutline"),
      thigh: $("farThigh"),
      shinOut: $("farShinOutline"),
      shin: $("farShin"),
      kneeOut: $("farKneeOutline"),
      knee: $("farKnee"),
      foot: $("farFoot"),
      pedal: $("farPedal"),
      arm: $("farCrank"),
      armFace: $("farCrankFace"),
      footAngleOffset: 1.5
    },
    {
      phase: 0,
      hip: { x: 582, y: 380 },
      femur: 106,
      tibia: 110,
      thighOut: $("nearThighOutline"),
      thigh: $("nearThigh"),
      shinOut: $("nearShinOutline"),
      shin: $("nearShin"),
      kneeOut: $("nearKneeOutline"),
      knee: $("nearKnee"),
      foot: $("nearFoot"),
      pedal: $("nearPedal"),
      arm: $("nearCrank"),
      armFace: $("nearCrankFace"),
      footAngleOffset: -1.5
    }
  ];

  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

  function solveKnee(hip, ankle, femur, tibia) {
    let dx = ankle.x - hip.x;
    let dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    const max = femur + tibia - 0.6;
    const min = Math.abs(femur - tibia) + 0.6;
    if (d > max) d = max;
    if (d < min) d = min;

    const ux = dx / (Math.hypot(dx, dy) || 1);
    const uy = dy / (Math.hypot(dx, dy) || 1);
    const a = (femur * femur - tibia * tibia + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, femur * femur - a * a));

    return {
      x: hip.x + ux * a + uy * h,
      y: hip.y + uy * a - ux * h
    };
  }

  function drawLeg(leg, angle) {
    const pedal = {
      x: crankX + Math.cos(angle) * crankR,
      y: crankY + Math.sin(angle) * crankR
    };
    const ankle = { x: pedal.x + 1.5, y: pedal.y - 15.5 };
    const knee = solveKnee(leg.hip, ankle, leg.femur, leg.tibia);

    // A subtle bow in each leg segment keeps the lines from feeling mechanical.
    const thighCtrl = {
      x: (leg.hip.x + knee.x) / 2 + 4,
      y: (leg.hip.y + knee.y) / 2
    };
    const shinCtrl = {
      x: (knee.x + ankle.x) / 2 - 4,
      y: (knee.y + ankle.y) / 2
    };

    const thighD = `M ${leg.hip.x} ${leg.hip.y} Q ${thighCtrl.x} ${thighCtrl.y} ${knee.x} ${knee.y}`;
    const shinD = `M ${knee.x} ${knee.y} Q ${shinCtrl.x} ${shinCtrl.y} ${ankle.x} ${ankle.y}`;

    leg.thighOut.setAttribute("d", thighD);
    leg.thigh.setAttribute("d", thighD);
    leg.shinOut.setAttribute("d", shinD);
    leg.shin.setAttribute("d", shinD);

    leg.kneeOut.setAttribute("cx", knee.x);
    leg.kneeOut.setAttribute("cy", knee.y);
    leg.knee.setAttribute("cx", knee.x);
    leg.knee.setAttribute("cy", knee.y);

    const footRotate = Math.sin(angle * 2) * 3 + leg.footAngleOffset;
    leg.foot.setAttribute("transform",
      `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}) rotate(${footRotate.toFixed(2)})`);

    leg.pedal.setAttribute("transform", `translate(${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)})`);

    leg.arm.setAttribute("x2", pedal.x.toFixed(2));
    leg.arm.setAttribute("y2", pedal.y.toFixed(2));
    leg.armFace.setAttribute("x2", pedal.x.toFixed(2));
    leg.armFace.setAttribute("y2", pedal.y.toFixed(2));
  }

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const svgArt = document.querySelector(".stage > svg");
  let start = null;

  if (reducedMotion.matches) {
    svgArt.pauseAnimations?.();
  }

  function frame(now) {
    if (start === null) start = now;
    const elapsed = reducedMotion.matches ? 0 : now - start;
    const theta = -0.72 + (elapsed / 1180) * Math.PI * 2;

    drawLeg(legs[0], theta + legs[0].phase);
    drawLeg(legs[1], theta + legs[1].phase);

    if (!reducedMotion.matches) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // Stop every layer (CSS, SMIL, JS) when the viewer asks for less motion.
  reducedMotion.addEventListener?.("change", () => {
    if (!reducedMotion.matches) {
      svgArt.unpauseAnimations?.();
      start = null;
      requestAnimationFrame(frame);
    } else {
      svgArt.pauseAnimations?.();
      drawLeg(legs[0], legs[0].phase - 0.72);
      drawLeg(legs[1], legs[1].phase - 0.72);
    }
  });
})();
</script>
</body>
</html>
